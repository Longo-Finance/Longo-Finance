name: Publicar en Apps Script

on:
  push:
    branches: [main]
    paths: ["apps-script/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: apps-script-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalar clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Credenciales y proyecto
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ vars.SCRIPT_ID }}
        run: |
          test -n "$CLASPRC_JSON" || { echo "::error::Falta el secreto CLASPRC_JSON"; exit 1; }
          test -n "$SCRIPT_ID" || { echo "::error::Falta la variable SCRIPT_ID"; exit 1; }
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"apps-script"}' "$SCRIPT_ID" > .clasp.json

      - name: Subir el código
        run: clasp push --force

      - name: Publicar nueva versión (mismo link)
        env:
          DEPLOYMENT_ID: ${{ vars.DEPLOYMENT_ID }}
        run: |
          test -n "$DEPLOYMENT_ID" || { echo "::error::Falta la variable DEPLOYMENT_ID"; exit 1; }
          # Acepta el ID solo o el link completo de la app web (.../macros/s/<ID>/exec)
          ID=$(printf '%s' "$DEPLOYMENT_ID" | sed -E 's#^.*/macros/s/([^/]+).*$#\1#' | tr -d '[:space:]')
          clasp deploy --deploymentId "$ID" --description "$(git log -1 --pretty=%s | cut -c1-90)"
